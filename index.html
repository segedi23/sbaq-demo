<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SBAQ Testialusta (demo)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">SBAQ</span>
      <span class="tag">Speed · Balance · Agility · Quickness</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="roster" class="active">Pelaajat</button>
      <button data-view="compare">Vertailu</button>
    </nav>
    <div class="rolebox">
      <label>Rooli</label>
      <select id="roleSelect" title="Demo: vaihda roolia (ylläpitäjä näkee kaiken, pelaaja vain omansa)"></select>
    </div>
  </header>

  <main id="app"></main>

  <footer class="foot">
    Demo · synteettinen data (<span id="pcount"></span> pelaajaa) · numerot lasketaan datasta, eivät ole oikeita henkilöitä
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
